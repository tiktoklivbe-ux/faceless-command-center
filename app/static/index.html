<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>AETHER · Faceless Command Center</title>
  <link rel="stylesheet" href="/assets/command-center.css"/>
</head>
<body>

  <!-- boot intro -->
  <div id="boot">
    <div>
      <div class="boot-orb"></div>
      <div class="boot-title">AETHER</div>
      <div class="boot-lines" id="boot-lines"></div>
    </div>
    <div class="boot-skip" id="boot-skip">skip ▸</div>
  </div>

  <!-- top HUD -->
  <div class="hud" id="topbar">
    <div class="brandmark">
      <span class="bm-orb"></span>
      <span class="bm-name">FACELESS <b>COMMAND</b></span>
    </div>
    <div class="stat-cluster">
      <div class="stat-item"><div class="sv" id="stat-videos">0</div><div class="sl">Videos</div></div>
      <div class="stat-item"><div class="sv" id="stat-progress">0</div><div class="sl">In Flight</div></div>
      <div class="stat-item"><div class="sv" id="stat-published">0</div><div class="sl">Published</div></div>
      <div class="stat-item"><div class="sv" id="stat-today">0</div><div class="sl">Today</div></div>
      <div class="stat-item"><div class="sv" id="clock">--:--</div><div class="sl">Local</div></div>
    </div>
  </div>

  <!-- Scroll-driven navigation: each full-viewport <section> is a "scene".
       Mouse-wheel/trackpad scroll moves between them with native scroll-snap
       (smooth, no hand-rolled physics); a slim dot-nav on the right is the
       click-to-jump alternative for keyboard/pointer users. This replaces
       BOTH the old sidebar tabs and the 3D village -- there's no separate
       "home" renderer competing for frame budget any more, Overview is just
       the first scene in the same scroll track as everything else. -->
  <div id="scene-track">
    <section class="scene" id="scene-overview" data-scene="overview">
      <div class="scene-body" id="scene-body-overview"></div>
    </section>
    <section class="scene" id="scene-missioncontrol" data-scene="missioncontrol">
      <div class="scene-body" id="scene-body-missioncontrol"></div>
    </section>
    <section class="scene" id="scene-jobs" data-scene="jobs">
      <div class="scene-body" id="scene-body-jobs"></div>
    </section>
    <section class="scene" id="scene-channels" data-scene="channels">
      <div class="scene-body" id="scene-body-channels"></div>
    </section>
    <section class="scene" id="scene-settings" data-scene="settings">
      <div class="scene-body" id="scene-body-settings"></div>
    </section>
    <section class="scene" id="scene-jarvis" data-scene="jarvis">
      <div class="scene-body" id="scene-body-jarvis"></div>
    </section>
  </div>

  <!-- dot-nav: click-to-jump alternative to scrolling -->
  <div id="dot-nav">
    <button class="dot" data-jump="overview" title="Overview"><span>Overview</span></button>
    <button class="dot" data-jump="missioncontrol" title="Mission Control"><span>Mission Control</span></button>
    <button class="dot" data-jump="jobs" title="Videos"><span>Videos</span></button>
    <button class="dot" data-jump="channels" title="Channels"><span>Channels</span></button>
    <button class="dot" data-jump="settings" title="Settings"><span>Settings</span></button>
    <button class="dot" data-jump="jarvis" title="Jarvis"><span>Jarvis</span></button>
  </div>

  <!-- agent detail flyout -->
  <div id="agent-detail"></div>

  <!-- toasts -->
  <div id="toasts"></div>

  <script src="/assets/lock.js"></script>
  <script src="/assets/command-center.js"></script>
  <script src="/assets/mouse-fx.js"></script>
  <script src="/assets/easter-eggs.js"></script>
</body>
</html>

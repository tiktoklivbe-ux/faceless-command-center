<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>AETHER · Faceless Command Center</title>
  <link rel="stylesheet" href="/assets/command-center.css"/>
</head>
<body>

  <!-- boot intro -->
  <div id="boot">
    <div>
      <div class="boot-orb"></div>
      <div class="boot-title">AETHER</div>
      <div class="boot-lines" id="boot-lines"></div>
    </div>
    <div class="boot-skip" id="boot-skip">skip ▸</div>
  </div>

  <!-- The village IS the home view now. The old starfield/orbit constellation
       has been removed entirely rather than hidden -- it was a second full
       renderer competing for the same frame budget. -->
  <div id="village-home">
    <div id="village-stage"></div>
  </div>

  <!-- top HUD -->
  <div class="hud" id="topbar">
    <div class="brandmark">
      <span class="bm-orb"></span>
      <span class="bm-name">FACELESS <b>COMMAND</b></span>
    </div>
    <div class="stat-cluster">
      <div class="stat-item"><div class="sv" id="stat-videos">0</div><div class="sl">Videos</div></div>
      <div class="stat-item"><div class="sv" id="stat-progress">0</div><div class="sl">In Flight</div></div>
      <div class="stat-item"><div class="sv" id="stat-published">0</div><div class="sl">Published</div></div>
      <div class="stat-item"><div class="sv" id="stat-today">0</div><div class="sl">Today</div></div>
      <div class="stat-item"><div class="sv" id="clock">--:--</div><div class="sl">Local</div></div>
    </div>
  </div>

  <!-- Navigation lives in the left sidebar only. There used to be a second
       icon-only toolbar on the right with the exact same five destinations,
       which just made it unclear which one to use. -->
  <div id="sidebar">
    <button class="side-item active" id="side-orbit" title="Back to the village">
      <span class="side-icon">🏘️</span><span class="side-label">Village</span>
    </button>
    <button class="side-item" id="side-missioncontrol" title="Mission Control">
      <span class="side-icon">🛰️</span><span class="side-label">Mission Control</span>
    </button>
    <button class="side-item" id="side-jobs" title="Video Library">
      <span class="side-icon">🎬</span><span class="side-label">Videos</span>
    </button>
    <button class="side-item" id="side-channels" title="Channels">
      <span class="side-icon">📺</span><span class="side-label">Channels</span>
    </button>
    <button class="side-item" id="side-settings" title="Settings">
      <span class="side-icon">⚙️</span><span class="side-label">Settings</span>
    </button>
  </div>

  <!-- The floating rituals/activity/telemetry panels are gone. They were
       leftovers from the space theme, sat permanently on top of the world,
       and are exactly the overlap problem -- that information belongs in
       Mission Control, not hovering over the village. -->

  <!-- command console -->
  <div id="console">
    <div id="console-shell">
      <span class="console-orb"></span>
      <input id="cmd" autocomplete="off" placeholder="Ask AETHER anything, or say &quot;make a video about black holes&quot;…"/>
      <button id="cmd-send" title="Send">▸</button>
    </div>
    <div id="console-hint">press <b>/</b> to focus · <b>WASD</b> or drag to fly · scroll to zoom · click any agent</div>
  </div>

  <!-- agent detail flyout -->
  <div id="agent-detail"></div>

  <!-- big slide panel -->
  <div id="bigpanel"><div id="bigpanel-inner"></div></div>

  <!-- toasts -->
  <div id="toasts"></div>

  <script src="/assets/village.js"></script>
  <script src="/assets/command-center.js"></script>
  <script src="/assets/mouse-fx.js"></script>
  <script src="/assets/easter-eggs.js"></script>
</body>
</html>
